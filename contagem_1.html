<style>
  :root{
    --ink:#E8EAED;
    --ink-soft:#8D96A3;
    --paper:#0A0D11;
    --panel:#12161C;
    --panel-2:#1A1F27;
    --line:#232933;
    --line-strong:#333B47;
    --accent:#178F63;
    --accent-bright:#2ED191;
    --accent-dark:#0F6E4B;
    --accent-ink:#FFFFFF;
    --navy:#0C1F35;
    --ok:#34D399;
    --ok-bg:rgba(52,211,153,.14);
    --bad:#F0645F;
    --bad-bg:rgba(240,100,95,.14);
    --warn:#F0B429;
    --warn-bg:rgba(240,180,41,.13);
    --neutral-txt:#6FA8E8;
    --neutral-bg:rgba(111,168,232,.14);
    --muted:#6B7280;
    --radius:9px;
    --radius-lg:13px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 6px 20px rgba(0,0,0,.35);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--ink);font-family:var(--sans);}
  body{
    -webkit-tap-highlight-color: transparent; padding-bottom:26px; font-size:13.5px; line-height:1.38;
    background-color:var(--paper);
  }
  .bg-mesh{
    position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-mesh svg{width:100%; height:100%; display:block;}
  .topbar, .wrap, footer{position:relative; z-index:1;}
  h1,h2,h3{font-weight:800; margin:0 0 4px; letter-spacing:-.01em;}
  a{color:var(--accent-bright);}
  ::selection{background:var(--accent); color:#fff;}
  code{background:var(--panel-2); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:.92em;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .topbar{
    background:var(--navy); color:#fff; padding:8px 14px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    position:sticky; top:0; z-index:20; border-bottom:1px solid rgba(46,209,145,.35);
  }
  .topbar .brandrow{display:flex; align-items:center; gap:9px;}
  .topbar .logo-mark{width:26px; height:26px; display:block; flex-shrink:0;}
  .topbar .brand{font-size:10.5px; font-weight:700; letter-spacing:.03em; color:#8FA3B8;}
  .topbar .sub{font-size:14.5px; font-weight:800; color:#fff; letter-spacing:-.01em; line-height:1.2;}
  .topbar button.link{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#fff; font-size:11.5px;
    font-weight:700; padding:6px 11px; border-radius:999px; cursor:pointer; font-family:inherit;
  }
  .topbar button.link:hover{background:rgba(255,255,255,.14);}

  .wrap{max-width:600px; margin:0 auto; padding:11px;}
  .wrap.wrap-wide{max-width:1320px; padding:16px 20px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px; margin-bottom:9px; box-shadow:var(--shadow-sm);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  @media (max-width:480px){ .grid2{grid-template-columns:1fr;} }

  .modebtn{
    display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius-lg); padding:14px; cursor:pointer; font-family:inherit; color:var(--ink);
    box-shadow:var(--shadow-sm); transition:border-color .15s, transform .1s;
  }
  .modebtn:hover{border-color:var(--accent);}
  .modebtn:active{background:var(--panel-2); transform:scale(.995);}
  .modebtn .em{font-size:19px; line-height:1;}
  .modebtn h2{font-size:14px; margin-top:6px;}
  .modebtn p{font-size:11.5px; color:var(--ink-soft); margin:3px 0 0; line-height:1.35;}

  label{display:block; font-size:10px; font-weight:800; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em;}
  input[type=text], input[type=number], input[type=file], select{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; font-size:16px;
    font-family:inherit; background:var(--panel-2); color:var(--ink);
  }
  input::placeholder{color:var(--muted);}
  input[type=file]{font-size:13px; padding:8px;}
  input:disabled, select:disabled{background:var(--panel); color:var(--ink-soft);}
  input:focus, select:focus{outline:2px solid var(--accent-bright); outline-offset:1px; border-color:var(--accent-bright);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
    padding:11px 16px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
    min-height:44px; transition:filter .1s, transform .05s;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{filter:brightness(.92); transform:scale(.99);}
  .btn.secondary{background:var(--panel-2); color:#fff; border:1px solid var(--line-strong);}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-strong);}
  .btn.ghost:hover{border-color:var(--ink-soft);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.small{padding:6px 11px; font-size:12px; min-height:auto;}
  .btn:focus-visible, .modebtn:focus-visible, .addr-item:focus-visible, button:focus-visible{
    outline:2px solid var(--accent-bright); outline-offset:2px;
  }

  .row{display:flex; gap:8px; align-items:center;}
  .row.between{justify-content:space-between;}
  .muted{color:var(--muted); font-size:11.5px;}

  .pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:800; letter-spacing:.02em;}
  .pill.ok{background:var(--ok-bg); color:var(--ok);}
  .pill.bad{background:var(--bad-bg); color:var(--bad);}
  .pill.warn{background:var(--warn-bg); color:var(--warn);}
  .pill.muted{background:var(--panel-2); color:var(--muted);}
  .pill.neutral{background:var(--neutral-bg); color:var(--neutral-txt);}

  .addr-list{max-height:58vh; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);}
  .wrap-wide .addr-list{max-height:68vh;}
  .addr-item{
    display:flex; justify-content:space-between; align-items:center; padding:9px 12px;
    border-bottom:1px solid var(--line); cursor:pointer; background:transparent; transition:background .1s;
  }
  .addr-item:last-child{border-bottom:none;}
  .addr-item:hover{background:var(--panel-2);}
  .addr-item:active{background:var(--panel-2);}
  .addr-item .code{font-family:var(--mono); font-weight:800; font-size:13.5px; letter-spacing:-.01em;}
  .addr-item .count{font-size:11px; color:var(--muted);}

  .item-card{border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; margin-bottom:6px; background:var(--panel); box-shadow:var(--shadow-sm);}
  .item-card .name{font-weight:700; font-size:13px;}
  .item-card .meta{font-size:11px; color:var(--muted); margin:1px 0 6px; font-family:var(--mono);}
  .item-card.extra{border-left:3px solid var(--warn);}
  .item-card.empty-confirmed{border-left:3px solid var(--bad); background:rgba(240,100,95,.06);}
  .qty-row{display:flex; gap:6px; align-items:stretch;}
  .qty-row .qtyInput{flex:1; min-width:0;}
  .btn-nada{
    flex-shrink:0; background:transparent; border:1.5px solid var(--bad); color:var(--bad);
    border-radius:8px; padding:0 11px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:background .1s;
  }
  .btn-nada:hover{background:var(--bad-bg);}
  .btn-nada.active{background:var(--bad); color:#fff;}
  .btn-nada.active:hover{filter:brightness(1.08);}
  .btn-calc{
    flex-shrink:0; width:42px; background:var(--panel-2); border:1.5px solid var(--line-strong); color:var(--ink);
    border-radius:8px; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center;
    transition:background .1s, border-color .1s;
  }
  .btn-calc:hover{border-color:var(--accent-bright); color:var(--accent-bright);}
  .btn-calc svg{width:17px; height:17px;}
  .empty-tag{display:inline-block; margin-top:5px; font-size:10px; font-weight:800; color:var(--bad); letter-spacing:.01em;}

  table{width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed;}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; word-wrap:break-word;}
  th{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); background:var(--panel-2); position:sticky; top:0; z-index:1; cursor:pointer; user-select:none; white-space:nowrap;}
  th:hover{color:var(--ink);}
  th .sort-arrow{color:var(--accent-bright); margin-left:3px;}
  td .mono, .mono{font-family:var(--mono);}
  .col-endereco{width:9%;}
  .col-produto{width:26%;}
  .col-num{width:8%;}
  .col-status{width:14%;}
  .col-obs{width:auto;}
  tbody tr:hover td{background:var(--panel-2);}
  tr.status-DIVERGENTE td{background:rgba(240,100,95,.07);}
  tr.status-DIVERGENTE:hover td{background:rgba(240,100,95,.13);}
  tr.status-MAIS td{background:rgba(240,180,41,.07);}
  tr.status-MAIS:hover td{background:rgba(240,180,41,.13);}
  tr.status-MENOS td{background:rgba(240,100,95,.07);}
  tr.status-MENOS:hover td{background:rgba(240,100,95,.13);}
  tr.status-NAO_CONTADO td{color:var(--muted);}
  tr.status-CONFLITO td{background:rgba(240,180,41,.07);}
  tr.status-REALOCADO td{background:rgba(111,168,232,.08);}
  tr.status-EXTRA td{background:rgba(240,180,41,.06);}

  .summary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:9px;}
  @media (min-width:560px){ .summary-grid{grid-template-columns:repeat(4,1fr);} }
  .wrap-wide .summary-grid{grid-template-columns:repeat(4,1fr); gap:10px;}
  .stat{border:1px solid var(--line); border-radius:var(--radius); padding:10px; background:var(--panel); text-align:center; box-shadow:var(--shadow-sm);}
  .stat .num{font-size:19px; font-weight:800; letter-spacing:-.02em;}
  .stat .lbl{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}

  .filterbar{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px;}
  .filterbar button{
    border:1.5px solid var(--line-strong); background:var(--panel); padding:5px 11px; border-radius:999px;
    font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; color:var(--ink); transition:all .1s;
  }
  .filterbar button:hover{border-color:var(--accent-bright);}
  .filterbar button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .search-wrap{position:sticky; top:0; background:var(--paper); padding:3px 0 8px; z-index:10;}
  .empty{text-align:center; padding:22px 10px; color:var(--muted); font-size:12.5px;}
  .warn-box{background:var(--warn-bg); border:1px solid rgba(240,180,41,.3); border-radius:var(--radius); padding:9px 12px; font-size:12px; color:#F0B429; margin-bottom:9px;}
  .err-box{background:var(--bad-bg); border:1px solid rgba(240,100,95,.3); border-radius:var(--radius); padding:9px 12px; font-size:12px; color:#F0645F; margin-bottom:9px;}
  .ok-box{background:var(--ok-bg); border:1px solid rgba(52,211,153,.3); border-radius:var(--radius); padding:9px 12px; font-size:12px; color:#34D399; margin-bottom:9px;}
  .backlink{background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;padding:5px 0;margin-bottom:4px;font-family:inherit;}
  .backlink:hover{color:var(--ink);}
  .divider{height:1px; background:var(--line); margin:11px 0;}
  .table-wrap{overflow-x:auto; overflow-y:auto; max-height:70vh; border:1px solid var(--line); border-radius:var(--radius);}
  .spinner{display:inline-block; width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--accent-bright); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{text-align:center; padding:16px; color:var(--muted); font-size:11px;}
  .badge-sync{font-size:10px; padding:2px 7px; border-radius:999px; font-weight:700;}
  .badge-sync.on{background:var(--ok-bg); color:var(--ok);}
  .badge-sync.off{background:var(--bad-bg); color:var(--bad);}

  /* ---- Calculadora ---- */
  .calc-overlay{
    position:fixed; inset:0; background:rgba(4,6,8,.72); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:560px){ .calc-overlay{align-items:center;} }
  .calc-overlay.hidden{display:none;}
  .calc-box{
    background:var(--panel); border:1px solid var(--line-strong); border-radius:16px 16px 0 0;
    width:100%; max-width:340px; padding:14px; box-shadow:var(--shadow-md);
  }
  @media (min-width:560px){ .calc-box{border-radius:16px;} }
  .calc-display{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:16px 14px;
    text-align:right; font-family:var(--mono); font-size:30px; font-weight:700; color:var(--ink);
    margin-bottom:10px; overflow-x:auto; white-space:nowrap; letter-spacing:-.01em;
  }
  .calc-expr{font-size:11.5px; color:var(--muted); text-align:right; min-height:14px; margin-bottom:2px; font-family:var(--mono);}
  .calc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px;}
  .calc-key{
    background:var(--panel-2); border:1px solid var(--line-strong); color:var(--ink); border-radius:9px;
    font-size:17px; font-weight:700; padding:14px 0; cursor:pointer; font-family:inherit; transition:filter .1s;
  }
  .calc-key:active{filter:brightness(1.3);}
  .calc-key.op{background:rgba(23,143,99,.16); color:var(--accent-bright); border-color:rgba(46,209,145,.3);}
  .calc-key.eq{background:var(--accent); color:#fff; border-color:var(--accent);}
  .calc-key.fn{color:var(--ink-soft); font-size:14px;}
  .calc-actions{display:flex; gap:8px; margin-top:10px;}
  .calc-actions .btn{flex:1;}

  /* ---- Impressão (Relatório -> Salvar como PDF) ---- */
  @media print{
    .bg-mesh, .topbar, .filterbar, #calcOverlay, .no-print, #concSearchLive{ display:none !important; }
    :root{
      --ink:#14181D; --ink-soft:#4A4E57; --paper:#fff; --panel:#fff; --panel-2:#F4F3EF;
      --line:#D8D5CC; --line-strong:#B8B4A8; --muted:#6B6F76;
    }
    body{ background:#fff !important; padding-bottom:0; }
    .wrap, .wrap-wide{ max-width:100% !important; padding:0 !important; }
    .card, .stat{ box-shadow:none !important; border:1px solid #D8D5CC !important; break-inside:avoid; }
    th{ background:#F4F3EF !important; }
  }

  /* ---- Relatório: dashboard em mosaico (bento grid), com mais acabamento ---- */
  .section-sub{ font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:10px; }
  .dash-grid{
    display:grid; grid-template-columns:repeat(12, 1fr); grid-auto-rows:minmax(96px, auto); gap:14px;
  }
  .dash-card{
    background:linear-gradient(160deg, var(--panel) 0%, var(--panel-2) 130%);
    border:1px solid var(--line-strong); border-radius:16px; padding:16px 18px;
    box-shadow:0 8px 24px rgba(0,0,0,.38), 0 2px 6px rgba(0,0,0,.3);
    overflow:hidden;
  }
  .span-3{ grid-column:span 3; }
  .span-4{ grid-column:span 4; }
  .span-5{ grid-column:span 5; }
  .span-12{ grid-column:span 12; }
  .span-row2{ grid-row:span 2; }
  .span-row3{ grid-row:span 3; }
  .ring-card{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; }
  .ring-card svg{ margin-bottom:2px; filter:drop-shadow(0 3px 10px rgba(0,0,0,.35)); }
  .ring-lbl{ font-size:11.5px; color:var(--ink-soft); font-weight:800; line-height:1.25; text-transform:uppercase; letter-spacing:.02em; }
  .big-stat-card{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; }
  .big-stat-num{
    font-size:44px; font-weight:900; letter-spacing:-.02em; line-height:1;
    background:linear-gradient(160deg, #fff 0%, #9AA5B4 140%); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .mini-breakdown{ font-size:11px; font-weight:700; margin-top:6px; }
  .donut-row{ display:flex; align-items:center; gap:20px; flex-wrap:wrap; justify-content:center; height:100%; }
  .legend-mini{ display:flex; flex-direction:column; gap:9px; font-size:12.5px; font-weight:700; }
  .legend-mini .dot{ width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:7px; box-shadow:0 0 6px 0 currentColor; }
  .legend-mini .dot-ok{ background:linear-gradient(135deg,#5EEAD4,#0F9D6E); color:#0F9D6E; }
  .legend-mini .dot-bad{ background:linear-gradient(135deg,#FB9A96,#D1373A); color:#D1373A; }
  .legend-mini .dot-nao{ background:linear-gradient(135deg,#5B6472,#242B36); color:#5B6472; }
  .legend-mini .dot-warn{ background:linear-gradient(135deg,#FBD574,#D68E13); color:#D68E13; }
  .legend-mini b{ margin-left:6px; font-weight:900; }
  .compact-table table{ font-size:11px; }
  .compact-table th, .compact-table td{ padding:4px 6px; }
  @media (max-width:900px){
    .span-3{ grid-column:span 6; }
    .span-4{ grid-column:span 6; }
    .span-5{ grid-column:span 12; }
    .span-row2, .span-row3{ grid-row:span 1; }
  }
  @media (max-width:560px){ .span-3, .span-4{ grid-column:span 12; } }
  @media print{
    .dash-card{ box-shadow:none !important; background:#fff !important; }
    .big-stat-num{ background:none !important; -webkit-text-fill-color:initial !important; color:#111 !important; }
    .dash-grid{ grid-template-columns:repeat(12,1fr) !important; }
    .span-3{grid-column:span 3 !important;} .span-4{grid-column:span 4 !important;} .span-5{grid-column:span 5 !important;}
    .span-row2{grid-row:span 2 !important;} .span-row3{grid-row:span 3 !important;}
  }
</style>

  concSearchTerm: '',
  autoRefresh: null,
  sheetReachable: null,  // null=not tested yet, true/false after first attempt
  extrasDone: new Set(), // checklist: which "extra" items have been fixed in the ERP already
  submittedSnapshot: new Map() // key -> last qtd successfully sent to the sheet (avoids resubmitting unchanged items)
};

function keyOf(endereco, produto, tipo, emb, lote){
  return [endereco, produto, tipo, emb, lote].map(x => (x===undefined||x===null?'':String(x).trim())).join('|');
}
function extraKey(r){ return keyOf(r.endereco, r.produto, r.tipo, r.embalagem, r.lote); }
function toggleExtraDone(k){
  if(state.extrasDone.has(k)) state.extrasDone.delete(k);
  else state.extrasDone.add(k);
  renderConciliacaoResult();
}
function saveExtrasProgress(){

}
function loadExtrasProgress(){

}
function render(html){

}
function escapeHtml(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/`/g,'&#96;'); }
function slug(s){ return (s||'contador').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }
function dateStamp(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0'); }
function fmtTime(iso){ if(!iso) return ''; try{ const d = new Date(iso); return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }

// ---------- SHARED: parse baseline xlsx ----------
function parseBaselineWorkbook(workbook){
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
  return rows.map(r => ({
    produto: String(r['Produto']||'').trim(),
    tipo: String(r['Tipo']||'').trim(),
    embalagem: String(r['Embalagem']||'').trim(),
    lote: String(r['Lote']||'').trim(),
    local: String(r['Local']||'').trim(),
    endereco: String(r['Endereco']||'').trim(),
    situacao: String(r['Situacao']||'').trim(),
    saldo: Number(r['Saldo fisico'])
  })).filter(r => r.produto && r.endereco);
}

function buildIndexes(){
  const map = new Map();
  const pInfo = new Map();
  const lInfo = new Map(); // lote (uppercased) -> [{produto,tipo,embalagem}] (usually 1, rarely more)
  state.baseline.forEach(item => {
    if(!map.has(item.endereco)) map.set(item.endereco, []);
    map.get(item.endereco).push(item);
    const norm = item.produto.trim().toLowerCase();
    if(!pInfo.has(norm)){
      pInfo.set(norm, {produto:item.produto, tipo:item.tipo, embalagem:item.embalagem, lotes:new Set()});
    }
    if(item.lote && item.lote !== '-') pInfo.get(norm).lotes.add(item.lote);
    if(item.lote && item.lote !== '-'){
      const loteKey = item.lote.trim().toUpperCase();
      if(!lInfo.has(loteKey)) lInfo.set(loteKey, []);
      const existing = lInfo.get(loteKey);
      if(!existing.some(e => e.produto === item.produto)){
        existing.push({produto:item.produto, tipo:item.tipo, embalagem:item.embalagem, lote:item.lote});
      }
    }
  });
  state.byEndereco = map;
  state.enderecos = Array.from(map.keys()).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  state.produtoList = Array.from(new Set(state.baseline.map(r=>r.produto))).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  state.produtoInfo = pInfo;
  state.loteInfo = lInfo;
  state.searchList = state.produtoList.concat(Array.from(lInfo.keys()).sort());
}

// ---------- Google Sheet as shared state (no login, no files) ----------
function parseCsvLine(line){
  const out = []; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQ){
      if(c === '"'){ if(line[i+1] === '"'){ cur+='"'; i++; } else { inQ=false; } }
      else cur += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === ','){ out.push(cur); cur=''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}
function csvField(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(v.includes(',') || v.includes('"') || v.includes('\n')) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}

function cellVal(cell){
  if(!cell) return '';
  if(cell.v !== undefined && cell.v !== null) return String(cell.v);
  if(cell.f !== undefined && cell.f !== null) return String(cell.f);
  return '';
}

// Pure parser: turns a google.visualization gviz response object into our entry shape.
// Kept separate from the network/script-tag loading so it can be tested with a fake response.
function parseGvizResponse(resp){
  if(!resp || resp.status === 'error' || !resp.table) return null;
  const cols = resp.table.cols.map(c => (c.label || c.id || '').trim());
  const idx = {};
  cols.forEach((c,i) => { if(c) idx[c] = i; });
  const need = ['Endereco','Produto','Tipo','Embalagem','Lote','Previsto','QtdContada','Contador'];
  const hasAll = need.every(n => idx[n] !== undefined);
  if(!hasAll) return null;
  const rows = resp.table.rows || [];
  return rows.map(r => {
    const c = r.c || [];
    return {
      endereco: cellVal(c[idx['Endereco']]).trim(),
      produto: cellVal(c[idx['Produto']]).trim(),
      tipo: cellVal(c[idx['Tipo']]).trim(),
      embalagem: cellVal(c[idx['Embalagem']]).trim(),
      lote: cellVal(c[idx['Lote']]).trim(),
      previsto: (cellVal(c[idx['Previsto']]).trim() || 'SIM'),
      qtd: cellVal(c[idx['QtdContada']]).trim(),
      contador: cellVal(c[idx['Contador']]).trim()
    };
  }).filter(e => e.endereco && e.produto);
}

let gvizCounter = 0;
function loadGvizJsonp(timeoutMs){
  return new Promise((resolve) => {
    const cbName = 'gvizCb_' + (gvizCounter++) + '_' + Date.now();
    let settled = false;
    function finish(val){
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
      resolve(val);
    }
    window[cbName] = (resp) => finish(resp);
    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${GSHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&_=${Date.now()}`;
    script.onerror = () => finish(null);
    const timer = setTimeout(() => finish(null), timeoutMs || 8000);
    document.head.appendChild(script);
  });
}

async function fetchSheetEntries(){
  const resp = await loadGvizJsonp();
  const entries = resp ? parseGvizResponse(resp) : null;
  if(entries === null){
    state.sheetReachable = false;
    return [];
  }
  state.sheetReachable = true;
  return entries;
}

function submitToSheet(entry){
  const body = new URLSearchParams();
  body.set(ENTRY_IDS.endereco, entry.endereco);
  body.set(ENTRY_IDS.produto, entry.produto);
  body.set(ENTRY_IDS.tipo, entry.tipo || '');
  body.set(ENTRY_IDS.embalagem, entry.embalagem || '');
  body.set(ENTRY_IDS.lote, entry.lote || '-');
  body.set(ENTRY_IDS.situacao, entry.situacao || '');
  body.set(ENTRY_IDS.previsto, entry.previsto);
  body.set(ENTRY_IDS.qtd, String(entry.qtd));
  body.set(ENTRY_IDS.contador, entry.contador);
  return fetch(GFORM_SUBMIT_URL, { method:'POST', mode:'no-cors', body })
    .then(() => true)
    .catch(() => false);
}

async function refreshEnderecoStatus(){
  const entries = await fetchSheetEntries();
  state.liveEntries = entries;
  const map = new Map();
  entries.forEach(e => {
    if(!e.endereco) return;
    if(!map.has(e.endereco)) map.set(e.endereco, {contadores:new Set(), count:0, lastAt:''});
    const st = map.get(e.endereco);
    if(e.contador) st.contadores.add(e.contador);
    st.count++;
    if(e.timestamp) st.lastAt = e.timestamp;
  });
  state.enderecoStatus = map;
}

function renderEnderecoList(){
  const term = state.searchTerm.toLowerCase();

    const items = state.byEndereco.get(e);

      statusHtml = `<span class="pill ok">CONTADO${contadoresStr && contadoresStr!==state.contador ? ' · '+escapeHtml(contadoresStr) : ''}</span>`;

      statusHtml = '<span class="pill warn">PARCIAL (aqui)</span>';

      statusHtml = '<span class="pill muted">PENDENTE</span>';

    return `
      <div class="addr-item" onclick="openEndereco('${escapeAttr(e)}')">

function resolveLoteChoice(i){
  const m = window.__loteChoices[i];
  document.getElementById('exProdutoSearch').value = m.produto;
  onExProdutoInput();
}

function onExProdutoInput(){
  const raw = document.getElementById('exProdutoSearch').value.trim();
  const fb = document.getElementById('exProdutoFeedback');
  const dz = document.getElementById('exDetailsZone');
  if(!raw){ fb.innerHTML=''; dz.innerHTML=''; return; }
  const norm = raw.toLowerCase();

  let info = state.produtoInfo.get(norm);
  let presetLote = null;

  if(!info){
    const loteMatches = state.loteInfo.get(raw.toUpperCase());
    if(loteMatches && loteMatches.length === 1){
      info = state.produtoInfo.get(loteMatches[0].produto.trim().toLowerCase());
      presetLote = loteMatches[0].lote;
    } else if(loteMatches && loteMatches.length > 1){
      fb.innerHTML = `<span class="pill warn">⚠ esse lote aparece em mais de um produto — escolha qual é</span>`;
      window.__loteChoices = loteMatches;
      dz.innerHTML = loteMatches.map((m,i) => `
        <button class="btn ghost block" style="text-align:left; margin-top:6px;" onclick="resolveLoteChoice(${i})">${escapeHtml(m.produto)}</button>
      `).join('');
      return;
    }
  }

  const currentItems = state.byEndereco.get(state.currentEndereco) || [];
  if(info){
    const alreadyExpected = currentItems.some(it => it.produto.trim().toLowerCase() === info.produto.trim().toLowerCase());
    if(alreadyExpected){
      fb.innerHTML = `<span class="pill warn">⚠ já está na lista prevista deste endereço</span>`;
      dz.innerHTML = `<div class="warn-box" style="margin-top:8px;">Esse produto já aparece nos itens previstos aqui em cima — feche esse formulário e digite a quantidade direto no campo dele, em vez de adicionar como extra (senão o valor duplica).</div>`;
      return;
    }
    fb.innerHTML = `<span class="pill ok">✓ encontrado no sistema${presetLote ? ' · identificado pelo lote' : ''}</span>`;
    const lotes = Array.from(info.lotes).sort();
    const loteOptions = lotes.map(l => `<option value="${escapeAttr(l)}" ${l===presetLote?'selected':''}>${escapeAttr(l)}</option>`).join('');
    dz.innerHTML = `
      <div style="height:8px;"></div>
      <div class="row" style="gap:8px;">
        <div style="flex:1;"><label>Tipo</label><input type="text" value="${escapeAttr(info.tipo)}" disabled></div>
        <div style="flex:1;"><label>Embalagem</label><input type="text" value="${escapeAttr(info.embalagem)}" disabled></div>
      </div>
      <div style="height:8px;"></div>
      <label>Lote</label>
      ${lotes.length ? `
        <select id="exLoteSelect">${loteOptions}<option value="__outro__">Outro / não listado</option></select>
        <div id="exLoteOtherZone"></div>
      ` : `<input type="text" id="exLoteFree" placeholder="-" value="-">`}
      <div style="height:8px;"></div>
      <label>Quantidade contada</label>
      <input type="number" inputmode="decimal" step="any" id="exQtd">
      <div style="height:12px;"></div>

function captureCurrentInputs(){
  const endereco = state.currentEndereco;
  if(!endereco) return;
  const inputs = document.querySelectorAll('.qtyInput:not(.extraInput)');
  const items = state.byEndereco.get(endereco) || [];
  inputs.forEach(inp => {
    const key = inp.dataset.key;
    const val = inp.value;
    const match = items.find(it => keyOf(endereco,it.produto,it.tipo,it.embalagem,it.lote) === key);
    if(!match) return;
    if(val === ''){ state.results.delete(key); return; }
    state.results.set(key, {
      endereco, produto: match.produto, tipo: match.tipo, embalagem: match.embalagem, lote: match.lote,
      situacao: match.situacao, previsto:'SIM', qtd: val, contador: state.contador,
      datahora: new Date().toISOString()
    });
  });
  document.querySelectorAll('.extraInput').forEach(inp => {
    const existing = state.results.get(inp.dataset.key);
    if(existing){ existing.qtd = inp.value; }
  });
}

function syncItemCardVisual(input){
  const card = input.closest('.item-card');

  const btn = card.querySelector('.btn-nada');

// ---------- Calculadora (pra contagem de campo: ex. 5 sacos x 25kg) ----------
const calcIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="11" r="1"/><circle cx="16" cy="11" r="1"/><circle cx="8" cy="15" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><circle cx="8" cy="19" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="16" cy="19" r="1"/></svg>';

let calc = {display:'0', prev:null, op:null, waiting:false, exprLabel:''};

function calcRender(){
  document.getElementById('calcDisplay').textContent = calc.display.replace('.', ',');
  document.getElementById('calcExpr').textContent = calc.exprLabel || '\u00a0';
}

function calcDigit(d){
  if(calc.waiting || calc.display === '0'){ calc.display = d; calc.waiting = false; }
  else if(calc.display.replace('-','').length < 12){ calc.display += d; }
  calcRender();
}

function calcDot(){
  if(calc.waiting){ calc.display = '0.'; calc.waiting = false; }
  else if(!calc.display.includes('.')){ calc.display += '.'; }
  calcRender();
}

function calcToggleSign(){
  if(calc.display !== '0') calc.display = calc.display.startsWith('-') ? calc.display.slice(1) : '-' + calc.display;
  calcRender();
}

function calcBackspace(){
  if(calc.waiting) return;
  calc.display = calc.display.length > 1 ? calc.display.slice(0,-1) : '0';
  calcRender();
}

function calcClear(){
  calc = {display:'0', prev:null, op:null, waiting:false, exprLabel:''};
  calcRender();
}

function calcCompute(a, b, op){
  a = Number(a); b = Number(b);
  if(op === '+') return a + b;
  if(op === '−') return a - b;
  if(op === '×') return a * b;
  if(op === '÷') return b === 0 ? NaN : a / b;
  return b;
}

function calcSetOp(op){
  if(calc.op && !calc.waiting){
    calc.prev = calcCompute(calc.prev, calc.display, calc.op);
    calc.display = String(Math.round(calc.prev * 10000) / 10000);
  } else {
    calc.prev = calc.display;
  }
  calc.op = op;
  calc.waiting = true;
  calc.exprLabel = `${calc.prev} ${op}`;
  calcRender();
}

function calcEquals(){
  if(calc.op == null) return;
  const result = calcCompute(calc.prev, calc.display, calc.op);
  calc.exprLabel = `${calc.prev} ${calc.op} ${calc.display} =`;
  calc.display = isNaN(result) ? '0' : String(Math.round(result * 10000) / 10000);
  calc.prev = null; calc.op = null; calc.waiting = true;
  calcRender();
}

let calcTargetInput = null;

function openCalculator(btn){
  const card = btn.closest('.item-card');
  calcTargetInput = card ? card.querySelector('.qtyInput') : null;
  calc = {display:'0', prev:null, op:null, waiting:false, exprLabel:''};

  document.getElementById('calcOverlay').classList.remove('hidden');
}

function closeCalculator(){
  document.getElementById('calcOverlay').classList.add('hidden');
  calcTargetInput = null;
}

function calcUseValue(){
  if(calcTargetInput){
    calcTargetInput.value = calc.display;
    syncItemCardVisual(calcTargetInput);
  }
  closeCalculator();
}

async function saveEndereco(){
  const endereco = state.currentEndereco;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enviando...';

  captureCurrentInputs();

  const entriesForEndereco = Array.from(state.results.values()).filter(r => r.endereco === endereco);
  if(!state.submittedSnapshot) state.submittedSnapshot = new Map();
  const toSubmit = entriesForEndereco.filter(e => {
    const k = keyOf(e.endereco, e.produto, e.tipo, e.embalagem, e.lote);
    return state.submittedSnapshot.get(k) !== String(e.qtd);
  });

  if(toSubmit.length === 0){
    if(!state.enderecoStatus.has(endereco)) state.enderecoStatus.set(endereco, {contadores:new Set([state.contador]), count:entriesForEndereco.length, lastAt:new Date().toISOString()});
    renderEnderecoList();
    return;
  }

  btn.innerHTML = `<span class="spinner"></span> Enviando ${toSubmit.length} item(ns)...`;
  const results = await Promise.allSettled(toSubmit.map(entry => submitToSheet(entry)));
  const anyFail = results.some(r => r.status === 'rejected' || r.value === false);

  if(anyFail){
    alert('Não consegui confirmar o envio de tudo (pode ter sido falta de internet). Vou baixar um backup desse endereço agora — guarda esse arquivo até confirmar direto na planilha.');
    exportContagemBackup(endereco);
  } else {
    toSubmit.forEach(e => {
      const k = keyOf(e.endereco, e.produto, e.tipo, e.embalagem, e.lote);
      state.submittedSnapshot.set(k, String(e.qtd));
    });
  }

  if(!state.enderecoStatus.has(endereco)) state.enderecoStatus.set(endereco, {contadores:new Set([state.contador]), count:entriesForEndereco.length, lastAt:new Date().toISOString()});
  renderEnderecoList();
}

function exportContagemBackup(onlyEndereco){
  const header = ['Endereco','Produto','Tipo','Embalagem','Lote','Situacao','Previsto','QtdContada','Contador','DataHora'];
  const lines = [header.join(',')];
  state.results.forEach(r => {
    if(onlyEndereco && r.endereco !== onlyEndereco) return;
    lines.push([r.endereco,r.produto,r.tipo,r.embalagem,r.lote,r.situacao||'',r.previsto,r.qtd,r.contador,r.datahora].map(csvField).join(','));
  });
  downloadText(lines.join('\n'), `contagem_backup_${slug(state.contador)}_${dateStamp()}.csv`, 'text/csv');
}

function downloadText(text, filename, mime){
  const blob = new Blob([text], {type: mime + ';charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function parseCountCsv(text, filename){
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if(lines.length < 2) return [];
  const header = parseCsvLine(lines[0]).map(h=>h.trim());
  const idx = {};
  header.forEach((h,i) => idx[h]=i);
  const out = [];
  for(let i=1;i<lines.length;i++){
    const cols = parseCsvLine(lines[i]);
    if(cols.length < header.length) continue;
    out.push({
      endereco: cols[idx['Endereco']], produto: cols[idx['Produto']], tipo: cols[idx['Tipo']],
      embalagem: cols[idx['Embalagem']], lote: cols[idx['Lote']], previsto: cols[idx['Previsto']] || 'SIM',
      qtd: cols[idx['QtdContada']], contador: cols[idx['Contador']] || '', arquivo: filename
    });
  }
  return out;
}

async function renderConciliacaoDash(loading){
  if(loading) render(`<div class="card"><span class="spinner"></span> Buscando contagens na planilha...</div>`);
  state.liveEntries = await fetchSheetEntries();
  computeConciliacao();
}

function computeConciliacao(){
  const allEntries = state.liveEntries.slice();
  state.countFiles.forEach(cf => cf.entries.forEach(e => allEntries.push(e)));

  const entriesByKey = new Map();
  allEntries.forEach(e => {
    if(!e.endereco || !e.produto) return;
    const k = keyOf(e.endereco, e.produto, e.tipo, e.embalagem, e.lote);
    if(!entriesByKey.has(k)) entriesByKey.set(k, []);
    entriesByKey.get(k).push(e);
  });

  window.concRows = state.baseline.map(item => {
    const k = keyOf(item.endereco, item.produto, item.tipo, item.embalagem, item.lote);
    const matches = entriesByKey.get(k) || [];
    let status, qtdContada, obs;
    const contadores = Array.from(new Set(matches.map(m=>m.contador))).filter(Boolean).join(', ');
    if(matches.length === 0){
      status = 'NAO_CONTADO'; qtdContada = ''; obs = '';
    } else {
      const vals = Array.from(new Set(matches.map(m => Number(m.qtd))));
      if(vals.length > 1){
        status = 'CONFLITO'; qtdContada = vals.join(' / '); obs = `${matches.length} contagens com valores diferentes`;
      } else {
        qtdContada = vals[0];
        status = (qtdContada === item.saldo) ? 'OK' : 'DIVERGENTE';
        obs = matches.length > 1 ? `contado ${matches.length}x (mesmo valor)` : '';
      }
    }
    const diff = (qtdContada==='' || isNaN(Number(qtdContada))) ? '' : (Number(qtdContada) - item.saldo);
    return {endereco:item.endereco, produto:item.produto, tipo:item.tipo, embalagem:item.embalagem, lote:item.lote,
      situacao:item.situacao, saldo:item.saldo, qtdContada, diff, status, obs, contadores};
  });

  window.concExtras = [];
  entriesByKey.forEach((matches, k) => {
    const inBaseline = state.baseline.some(item => keyOf(item.endereco,item.produto,item.tipo,item.embalagem,item.lote) === k);
    if(!inBaseline){
      const sample = matches[0];
      const extraQtyVals = Array.from(new Set(matches.map(m=>Number(m.qtd))));
      const extraQty = extraQtyVals.length ? Math.max(...extraQtyVals) : 0;
      let hintEndereco = '', hintSaldo = '', hintNote = '', hintConflict = false;

      function statusOfBaselineItem(item){
        const kk = keyOf(item.endereco, item.produto, item.tipo, item.embalagem, item.lote);
        const m = entriesByKey.get(kk);
        if(!m) return {counted:false};
        const vals = Array.from(new Set(m.map(x=>Number(x.qtd))));
        if(vals.length>1) return {counted:true, conflito:true};
        return {counted:true, qtd:vals[0], deficit: item.saldo - vals[0]};
      }

      let candidates;
      if(sample.lote && sample.lote !== '-'){
        candidates = state.baseline.filter(item => item.produto===sample.produto && item.lote===sample.lote);
      } else {
        const hits = state.baseline.filter(item => item.produto===sample.produto);
        const distinctEnderecos = Array.from(new Set(hits.map(h=>h.endereco)));
        candidates = distinctEnderecos.length === 1 ? hits.slice(0,1) : [];
      }

      if(candidates.length){
        const withStatus = candidates.map(item => ({item, st: statusOfBaselineItem(item)}));
        const exact = withStatus.filter(x => x.st.counted && !x.st.conflito && x.st.deficit===0);
        const shortfall = withStatus.filter(x => x.st.counted && !x.st.conflito && x.st.deficit>0).sort((a,b)=>b.st.deficit-a.st.deficit);
        const unknown = withStatus.filter(x => !x.st.counted);
        const best = shortfall[0] || unknown[0];
        if(best && shortfall[0] && shortfall[0].st.deficit < extraQty*0.5){
          hintEndereco = best.item.endereco; hintSaldo = best.item.saldo;
          hintNote = `falta de apenas ${shortfall[0].st.deficit} lá — bem menor que os ${extraQty} aqui, pode não explicar tudo`;
          hintConflict = true;
        } else if(best){
          hintEndereco = best.item.endereco; hintSaldo = best.item.saldo;
          if(shortfall[0]) hintNote = `essa rua foi contada com falta de ${shortfall[0].st.deficit} — provável origem`;
        } else if(exact.length){
          hintNote = `CONFLITO: mesmo lote também contado e CONFIRMADO em ${exact[0].item.endereco} (bateu exato) — NÃO mover de lá.`;
          hintConflict = true;
        } else {
          hintNote = `CONFLITO: mesmo lote consta em ${candidates.length} endereço(s), nenhum com falta — excesso físico não explicado.`;
          hintConflict = true;
        }
      }
      window.concExtras.push({
        endereco: sample.endereco, produto: sample.produto, tipo: sample.tipo, embalagem: sample.embalagem, lote: sample.lote,
        qtdContada: matches.map(m=>m.qtd).join(' / '),
        contadores: Array.from(new Set(matches.map(m=>m.contador))).filter(Boolean).join(', '),
        hintEndereco, hintSaldo, hintNote, hintConflict
      });
    }
  });

  // Agregação por produto+lote — inclui os extras (achados fora do previsto) no total contado.
  // É a base única pra "bate no total" (REALOCADO) e pra acurácia — sempre por material, nunca
  // por endereço isolado, porque um endereço sozinho não diz se o material sumiu de verdade.
  const byProdutoLote = new Map();
  window.concRows.forEach(r => {
    const loteKey = (r.lote && r.lote !== '-') ? r.lote : '';
    const key = r.produto + '|||' + loteKey;
    if(!byProdutoLote.has(key)) byProdutoLote.set(key, {rows:[], extras:[]});
    byProdutoLote.get(key).rows.push(r);
  });
  window.concExtras.forEach(r => {
    const loteKey = (r.lote && r.lote !== '-') ? r.lote : '';
    const key = r.produto + '|||' + loteKey;
    if(!byProdutoLote.has(key)) byProdutoLote.set(key, {rows:[], extras:[]});
    byProdutoLote.get(key).extras.push(r);
  });

  window.concBateNoTotalKeys = new Set();
  let sumAbsDiffTotal = 0, sumEsperadoTotal = 0, groupsCounted = 0, groupsOk = 0;
  byProdutoLote.forEach((g, key) => {
    if(g.rows.length === 0) return; // só extra, sem linha do sistema — não cadastrado, fora da acurácia
    const totalEsperado = g.rows.reduce((s,r)=>s+Number(r.saldo),0);
    const allCounted = g.rows.every(r => r.status==='OK' || r.status==='DIVERGENTE');
    const hasDivergente = g.rows.some(r => r.status === 'DIVERGENTE');
    const totalContadoRows = g.rows.reduce((s,r)=> s + (r.status==='NAO_CONTADO'||r.status==='CONFLITO' ? 0 : Number(r.qtdContada)||0), 0);
    const totalContadoExtras = g.extras.reduce((s,r)=> s + (Number(String(r.qtdContada).split('/')[0])||0), 0);
    const totalContado = totalContadoRows + totalContadoExtras;
    const diffTotal = totalContado - totalEsperado;
    if(allCounted && hasDivergente && Math.abs(diffTotal) < 0.01){
      window.concBateNoTotalKeys.add(key);
    }
    if(!allCounted) return; // ainda falta contar algum endereço desse material — não avalia acurácia ainda
    groupsCounted++;
    sumAbsDiffTotal += Math.abs(diffTotal);
    sumEsperadoTotal += totalEsperado;
    if(Math.abs(diffTotal) < 0.01) groupsOk++;
  });

  // Product-level rollup (só por produto, sem separar lote): alimenta a aba "Por produto",
  // que é uma visão mais grosseira — "esse produto no geral tem falta real ou só bagunça de endereço".
  const byProduto = new Map();
  window.concRows.forEach(r => {
    if(!byProduto.has(r.produto)) byProduto.set(r.produto, {rows:[], extras:[]});
    byProduto.get(r.produto).rows.push(r);
  });
  window.concExtras.forEach(r => {
    if(!byProduto.has(r.produto)) byProduto.set(r.produto, {rows:[], extras:[]});
    byProduto.get(r.produto).extras.push(r);
  });
  window.concProdutoRollup = [];
  byProduto.forEach((data, produto) => {
    const hasIssue = data.rows.some(r => r.status==='DIVERGENTE') || data.extras.length>0;
    if(!hasIssue) return;
    const isNaoCadastrado = data.rows.length === 0;
    const reliable = data.rows.every(r => r.status==='OK' || r.status==='DIVERGENTE');
    const totalEsperado = data.rows.reduce((s,r)=>s+Number(r.saldo),0);
    const totalRegular = data.rows.reduce((s,r)=> s + (r.status==='NAO_CONTADO'||r.status==='CONFLITO' ? 0 : Number(r.qtdContada)||0), 0);
    const totalExtras = data.extras.reduce((s,r)=> s + (Number(String(r.qtdContada).split('/')[0])||0), 0);
    const totalContado = totalRegular + totalExtras;
    const diffTotal = totalContado - totalEsperado;
    let status;
    if(isNaoCadastrado) status = 'NAO_CADASTRADO';
    else if(!reliable) status = 'INCOMPLETO';
    else if(Math.abs(diffTotal) < 0.01) status = 'BATE_NO_TOTAL';
    else if(diffTotal < 0) status = 'FALTA_REAL';
    else status = 'SOBRA_REAL';
    window.concProdutoRollup.push({
      produto, totalEsperado, totalContado, diffTotal, status,
      enderecosCount: data.rows.length, extrasCount: data.extras.length
    });
  });

  const countedRows = window.concRows.filter(r => r.status !== 'NAO_CONTADO');
  window.concAccuracy = {
    coverage: window.concRows.length ? (countedRows.length / window.concRows.length * 100) : null,
    skuAccuracy: groupsCounted ? (groupsOk / groupsCounted * 100) : null,
    qtyAccuracy: sumEsperadoTotal > 0 ? Math.max(0, (1 - sumAbsDiffTotal/sumEsperadoTotal) * 100) : null,
    countedN: countedRows.length, totalN: window.concRows.length,
    sumAbsDiff: sumAbsDiffTotal, sumSaldoCounted: sumEsperadoTotal, extrasN: window.concExtras.length,
    groupsCounted, groupsOk
  };

  computeMovements(entriesByKey);

  state.concFilter = state.concFilter || 'ALL';
  renderConciliacaoResult();
}

function computeMovements(entriesByKey){
  const groups = new Map(); // gk -> {produto,tipo,embalagem,lote, items:[baseline], extras:[{endereco,qtd}]}
  function gkOf(produto,tipo,embalagem,lote){ return [produto,tipo,embalagem,lote].join('¦'); }

  state.baseline.forEach(item => {
    const gk = gkOf(item.produto,item.tipo,item.embalagem,item.lote);
    if(!groups.has(gk)) groups.set(gk, {produto:item.produto,tipo:item.tipo,embalagem:item.embalagem,lote:item.lote, items:[], extras:[]});
    groups.get(gk).items.push(item);
  });
  window.concExtras.forEach(ex => {
    const gk = gkOf(ex.produto,ex.tipo,ex.embalagem,ex.lote);
    if(!groups.has(gk)) groups.set(gk, {produto:ex.produto,tipo:ex.tipo,embalagem:ex.embalagem,lote:ex.lote, items:[], extras:[]});
    const vals = String(ex.qtdContada).split(' / ').map(Number);
    const qty = vals.length>1 ? Math.max(...vals) : vals[0];
    groups.get(gk).extras.push({endereco: ex.endereco, qtd: qty});
  });

  window.movTransfers = []; window.movS1 = []; window.movVerificar = [];

  groups.forEach((g) => {
    const deficits = [], excesses = [];
    const uncountedAddrs = [], conflitoAddrs = [];
    g.items.forEach(b => {
      const k = keyOf(b.endereco,b.produto,b.tipo,b.embalagem,b.lote);
      const m = entriesByKey.get(k);
      if(!m){ uncountedAddrs.push(b.endereco); return; }
      const vals = Array.from(new Set(m.map(x=>Number(x.qtd))));
      if(vals.length>1){ conflitoAddrs.push(b.endereco); return; }
      const diff = vals[0] - b.saldo;
      if(diff < -0.01) deficits.push({endereco:b.endereco, amt:-diff});
      else if(diff > 0.01) excesses.push({endereco:b.endereco, amt:diff});
    });
    g.extras.forEach(ex => excesses.push({endereco: ex.endereco, amt: ex.qtd}));

    const isNovo = g.items.length===0;
    const uncountedAny = uncountedAddrs.length>0, conflitoAny = conflitoAddrs.length>0;
    deficits.sort((a,b)=>b.amt-a.amt); excesses.sort((a,b)=>b.amt-a.amt);
    let di=0, ei=0;
    while(di<deficits.length && ei<excesses.length){
      const mv = Math.min(deficits[di].amt, excesses[ei].amt);
      if(mv>0.01) window.movTransfers.push({qtd:Math.round(mv*100)/100, origem:deficits[di].endereco, destino:excesses[ei].endereco, produto:g.produto, tipo:g.tipo, embalagem:g.embalagem, lote:g.lote});
      deficits[di].amt -= mv; excesses[ei].amt -= mv;
      if(deficits[di].amt<=0.01) di++;
      if(excesses[ei].amt<=0.01) ei++;
    }
    const leftoverDefList = deficits.slice(di).filter(d=>d.amt>0.01);
    const leftoverExcList = excesses.slice(ei).filter(e=>e.amt>0.01);
    const leftoverDef = leftoverDefList.reduce((s,d)=>s+d.amt,0);
    const leftoverExc = leftoverExcList.reduce((s,e)=>s+e.amt,0);
    const fmtAddrs = (list) => list.map(x=>`${x.endereco} (${x.amt.toFixed(0)} kg)`).join(', ');

    if(leftoverDef>0.01){
      if(!uncountedAny) window.movS1.push({qtd:Math.round(leftoverDef*100)/100, produto:g.produto, tipo:g.tipo, embalagem:g.embalagem, lote:g.lote, enderecos: fmtAddrs(leftoverDefList)});
      else window.movVerificar.push({produto:g.produto, lote:g.lote, motivo:'Falta parcial, mas há endereço(s) desse lote ainda não contados',
        detalhe:`Falta confirmada em: ${fmtAddrs(leftoverDefList)}. Endereço(s) não conferido(s) nessa rodada: ${uncountedAddrs.join(', ')}`});
    }
    if(leftoverExc>0.01){
      window.movVerificar.push({produto:g.produto, lote:g.lote, motivo: isNovo? 'Produto/lote não cadastrado no sistema' : 'Sobra não explicada por transferência',
        detalhe: isNovo ? `Achado em: ${fmtAddrs(leftoverExcList)}` : `Sobra em: ${fmtAddrs(leftoverExcList)} — sem endereço com falta correspondente`});
    }
    if(conflitoAny) window.movVerificar.push({produto:g.produto, lote:g.lote, motivo:'Contagens conflitantes em algum endereço', detalhe:`Endereço(s): ${conflitoAddrs.join(', ')}`});
  });
}

function statusPill(s, diff){
  if(s === 'DIVERGENTE'){
    const isMais = Number(diff) > 0;
    return `<span class="pill ${isMais?'warn':'bad'}">${isMais?'MATERIAL A MAIS':'MATERIAL A MENOS'}</span>`;
  }
  const map = {OK:'ok', NAO_CONTADO:'muted', CONFLITO:'warn'};
  const label = {OK:'OK', NAO_CONTADO:'NÃO CONTADO', CONFLITO:'CONFLITO'};
  return `<span class="pill ${map[s]}">${label[s]}</span>`;
}

// ---------- Ordenação da tabela de conciliação ----------
function setConcSort(key){
  if(state.concSort && state.concSort.key === key){
    state.concSort.dir *= -1;
  } else {
    state.concSort = {key, dir:1};
  }
  renderConciliacaoResult();
}

function sortArrow(key){
  if(!state.concSort || state.concSort.key !== key) return '';
  return `<span class="sort-arrow">${state.concSort.dir===1 ? '▲' : '▼'}</span>`;
}

function applySort(rows){
  const s = state.concSort;
  if(!s || !s.key) return rows;
  const key = s.key, dir = s.dir;
  return rows.slice().sort((a,b) => {
    let va = a[key], vb = b[key];
    if(key === 'saldo' || key === 'diff'){
      va = (va===''||va===undefined||va===null||isNaN(Number(va))) ? -Infinity : Number(va);
      vb = (vb===''||vb===undefined||vb===null||isNaN(Number(vb))) ? -Infinity : Number(vb);
    } else if(key === 'qtdContada'){
      const na = parseFloat(String(va)), nb = parseFloat(String(vb));
      va = isNaN(na) ? -Infinity : na;
      vb = isNaN(nb) ? -Infinity : nb;
    } else {
      va = String(va||'').toLowerCase(); vb = String(vb||'').toLowerCase();
    }
    if(va < vb) return -1 * dir;
    if(va > vb) return 1 * dir;
    return 0;
  });
}

let svgIdCounter = 0;
function nextSvgId(prefix){ return prefix + '_' + (svgIdCounter++); }

// Paletas gradiente (cor clara -> cor escura) por categoria semântica
const GRAD = {
  ok:    ['#5EEAD4', '#0F9D6E'],
  bad:   ['#FB9A96', '#D1373A'],
  nao:   ['#5B6472', '#242B36'],
  warn:  ['#FBD574', '#D68E13'],
  accent:['#5EEAD4', '#12805C'],
  blue:  ['#9CC7F5', '#3D7DC9']
};

// ---------- Gráficos SVG (sem libs externas), com gradiente + glow ----------
function svgDonut(segments, size, thickness){
  size = size || 168; thickness = thickness || 24;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const r = (size - thickness) / 2;
  const c = size / 2;
  const circumference = 2 * Math.PI * r;
  const glowId = nextSvgId('glow');
  let offset = 0;
  const defs = [];
  const paths = segments.map((seg,idx) => {
    const gradId = nextSvgId('dgrad');
    const gp = GRAD[seg.gradKey] || [seg.color, seg.color];
    defs.push(`<linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${gp[0]}"/><stop offset="100%" stop-color="${gp[1]}"/></linearGradient>`);
    const frac = seg.value / total;
    const dash = frac * circumference;
    const gap = circumference - dash;
    const el = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${gradId})" stroke-width="${thickness}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${c} ${c})" filter="url(#${glowId})"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex-shrink:0; overflow:visible;">
    <defs>
      ${defs.join('')}
      <filter id="${glowId}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${(thickness*0.14).toFixed(1)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${paths}
    <text x="${c}" y="${c-3}" text-anchor="middle" font-size="${(size*0.15).toFixed(0)}" font-weight="900" fill="var(--ink)">${total}</text>
    <text x="${c}" y="${c+16}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--muted)">itens</text>
  </svg>`;
}

function svgRing(valuePct, gradKey, size, thickness){
  size = size || 108; thickness = thickness || 10;
  const r = (size - thickness) / 2;
  const c = size / 2;
  const circumference = 2 * Math.PI * r;
  const v = (valuePct===null||valuePct===undefined||isNaN(valuePct)) ? null : Math.max(0, Math.min(100, valuePct));
  const dash = v===null ? 0 : circumference * v / 100;
  const gap = circumference - dash;
  const gradId = nextSvgId('rgrad');
  const glowId = nextSvgId('rglow');
  const gp = GRAD[gradKey] || ['#2ED191','#0F9D6E'];
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="overflow:visible;">
    <defs>
      <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${gp[0]}"/><stop offset="100%" stop-color="${gp[1]}"/></linearGradient>
      <filter id="${glowId}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${(thickness*0.22).toFixed(1)}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="${thickness}"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#${gradId})" stroke-width="${thickness}" stroke-linecap="round" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" transform="rotate(-90 ${c} ${c})" filter="url(#${glowId})"/>
    <text x="${c}" y="${c+size*0.08}" text-anchor="middle" font-size="${(size*0.25).toFixed(0)}" font-weight="900" fill="var(--ink)">${v===null?'—':v.toFixed(0)+'%'}</text>
  </svg>`;
}

function svgBarsH(items, opts){
  opts = opts || {};
  const width = opts.width || 600;
  const barH = opts.barH || 20;
  const gap = opts.gap || 9;
  const labelW = opts.labelW || 170;
  const maxVal = Math.max.apply(null, items.map(i => Math.abs(i.value)).concat([1]));
  const chartW = width - labelW - 64;
  const height = items.length * (barH + gap) + gap;
  const glowId = nextSvgId('bglow');
  const defs = [];
  const bars = items.map((it, idx) => {
    const y = gap + idx * (barH + gap);
    const w = Math.max(2, Math.abs(it.value) / maxVal * chartW);
    const gradId = nextSvgId('bgrad');
    const gp = GRAD[it.gradKey] || [it.color||'#2ED191', it.color||'#2ED191'];
    defs.push(`<linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="${gp[0]}"/><stop offset="100%" stop-color="${gp[1]}"/></linearGradient>`);
    const valueLabel = it.valueLabel !== undefined ? it.valueLabel : String(it.value);
    return `
      <text x="${labelW-8}" y="${y+barH/2+4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--ink-soft)">${escapeHtml(it.label)}</text>
      <rect x="${labelW}" y="${y}" width="${w.toFixed(1)}" height="${barH}" rx="${(barH/2.4).toFixed(1)}" fill="url(#${gradId})" filter="url(#${glowId})"/>
      <text x="${labelW+w+7}" y="${y+barH/2+4}" font-size="11" font-weight="700" fill="var(--ink)">${escapeHtml(valueLabel)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" style="overflow:visible;">
    <defs>
      ${defs.join('')}
      <filter id="${glowId}" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${bars}
  </svg>`;
}

      <tbody>${verRows || '<tr><td colspan="3" class="empty">Nenhum</td></tr>'}</tbody></table>
    </div>
    <button class="btn block" onclick="exportMovimentacoesXlsx()">⬇ Baixar movimentações (.xlsx)</button>
  `;
}

function exportMovimentacoesXlsx(){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((window.movTransfers||[]).map(t=>({'Quantidade':t.qtd,'De':t.origem,'Para':t.destino,'Produto':t.produto,'Tipo':t.tipo,'Embalagem':t.embalagem,'Lote':t.lote}))), 'Transferencias');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((window.movS1||[]).map(s=>({'Quantidade':s.qtd,'Produto':s.produto,'Tipo':s.tipo,'Embalagem':s.embalagem,'Lote':s.lote,'Endereco(s)':s.enderecos||'','Ajustar para':'S1'}))), 'Ajustar S1');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((window.movVerificar||[]).map(v=>({'Produto':v.produto,'Lote':v.lote,'Motivo':v.motivo,'Detalhe':v.detalhe}))), 'Verificar');
  XLSX.writeFile(wb, `movimentacoes_${SITE.nome}_${dateStamp()}.xlsx`);
}

function renderConciliacaoResult(){
  const concRows = window.concRows || [];
  const concExtras = window.concExtras || [];
  const total = concRows.length;
  const ok = concRows.filter(r=>r.status==='OK').length;
  const div = concRows.filter(r=>r.status==='DIVERGENTE').length;
  const nao = concRows.filter(r=>r.status==='NAO_CONTADO').length;
  const conf = concRows.filter(r=>r.status==='CONFLITO').length;

  const filter = state.concFilter;
  const extrasAsRows = concExtras.map(r => ({
    endereco: r.endereco, produto: r.produto, tipo: r.tipo, embalagem: r.embalagem, lote: r.lote,
    situacao: '', saldo: '', qtdContada: r.qtdContada, diff: '', status: 'EXTRA',
    obs: r.hintNote || 'não previsto no sistema', contadores: r.contadores
  }));
  let filtered = filter==='ALL' ? concRows.concat(extrasAsRows) : (filter==='EXTRAS' ? [] : concRows.filter(r=>r.status===filter));
  if(state.concSearchLive && state.concSearchLive.trim()){
    filtered = filtered.filter(r => matchesConcSearch(r.endereco) || matchesConcSearch(r.produto) || matchesConcSearch(r.lote));
  }
  filtered = applySort(filtered);

  const tableRows = filtered.map(r => {
    const loteKey = (r.lote && r.lote !== '-') ? r.lote : '';
    const bateNoTotal = r.status==='DIVERGENTE' && window.concBateNoTotalKeys && window.concBateNoTotalKeys.has(r.produto + '|||' + loteKey);
    let dispClass, dispStatus, dispObs;
    if(r.status === 'EXTRA'){
      dispClass = 'status-EXTRA';
      dispStatus = '<span class="pill warn">EXTRA · FORA DO PREVISTO</span>';
      dispObs = r.obs;
    } else if(bateNoTotal){
      dispClass = 'status-REALOCADO';
      dispStatus = '<span class="pill neutral">REALOCADO</span>';
      dispObs = 'bate no total do lote — mal alocado, não é falta real';
    } else if(r.status === 'DIVERGENTE'){
      const isMais = Number(r.diff) > 0;
      dispClass = isMais ? 'status-MAIS' : 'status-MENOS';
      dispStatus = statusPill(r.status, r.diff);
      dispObs = r.obs;
    } else {
      dispClass = `status-${r.status}`;
      dispStatus = statusPill(r.status);
      dispObs = r.obs;
    }
    return `
    <tr class="${dispClass}">
      <td class="mono">${escapeHtml(r.endereco)}</td>
      <td>${escapeHtml(r.produto)}<br><span class="muted">${escapeHtml(r.tipo)} · ${escapeHtml(r.embalagem)} · ${escapeHtml(r.lote)}</span></td>
      <td>${r.saldo}</td>
      <td>${escapeHtml(String(r.qtdContada))}</td>
      <td>${r.diff===''?'':r.diff}</td>
      <td>${dispStatus}</td>
      <td class="muted">${escapeHtml(dispObs)}${r.contadores?' · '+escapeHtml(r.contadores):''}</td>
    </tr>`;}).join('');

  const doneCount = concExtras.filter(r => state.extrasDone.has(extraKey(r))).length;
  const produtoRollup = (window.concProdutoRollup || []).filter(r => matchesConcSearch(r.produto));
  const produtoStatusLabel = {BATE_NO_TOTAL:'Bate no total (troca de endereço)', FALTA_REAL:'Falta real', SOBRA_REAL:'Sobra real', INCOMPLETO:'Incompleto', NAO_CADASTRADO:'Não cadastrado'};
  const produtoStatusClass = {BATE_NO_TOTAL:'neutral', FALTA_REAL:'bad', SOBRA_REAL:'warn', INCOMPLETO:'muted', NAO_CADASTRADO:'muted'};
  const produtoRows = produtoRollup.map(r => `
    <tr>
      <td>${escapeHtml(r.produto)}</td>
      <td>${r.totalEsperado}</td>
      <td>${r.totalContado}</td>
      <td>${r.diffTotal}</td>
      <td><span class="pill ${produtoStatusClass[r.status]}">${produtoStatusLabel[r.status]}</span></td>
    </tr>`).join('');
  const sortedExtras = concExtras.slice().sort((a,b) => {
    const da = state.extrasDone.has(extraKey(a)) ? 1 : 0;
    const db = state.extrasDone.has(extraKey(b)) ? 1 : 0;
    return da - db;
  });
  const extrasActionList = sortedExtras.map(r => {
    const k = extraKey(r);
    const isDone = state.extrasDone.has(k);
    const label = `${escapeHtml(r.produto)}${r.lote && r.lote!=='-' ? ' · lote '+escapeHtml(r.lote) : ''} — ${escapeHtml(String(r.qtdContada))}`;
    let action;
    if(r.hintEndereco && !r.hintConflict){
      action = `Mover de <strong>${escapeHtml(r.hintEndereco)}</strong> → <strong>${escapeHtml(r.endereco)}</strong> no sistema`;
    } else if(r.hintConflict){
      action = `<span style="color:var(--bad);">⚠ ${escapeHtml(r.hintNote)}</span> — verificar manualmente antes de mexer no sistema.`;
    } else {
      action = `Achado em <strong>${escapeHtml(r.endereco)}</strong>, não consta em nenhum endereço do sistema — conferir se é produto novo ou erro de cadastro`;
    }
    return `
      <div class="item-card" style="margin-bottom:8px; ${isDone ? 'opacity:.5;' : ''}">
        <label class="row" style="align-items:flex-start; gap:10px; cursor:pointer;">
          <input type="checkbox" ${isDone?'checked':''} onchange="toggleExtraDone('${escapeAttr(k)}')" style="width:20px; height:20px; margin-top:2px; flex-shrink:0;">
          <div style="flex:1;">
            <div class="name" style="${isDone?'text-decoration:line-through;':''}">${label}</div>
            <div class="meta" style="font-family:inherit; margin-top:4px;">${action}</div>
            ${r.contadores ? `<div class="muted" style="margin-top:4px; font-size:12px;">Contado por ${escapeHtml(r.contadores)}</div>` : ''}
          </div>
        </label>
      </div>`;
  }).join('');

  const connWarn = state.sheetReachable === false
    ? `<div class="err-box">Não consegui ler a planilha publicada agora daqui. Abra a planilha direto no Google Sheets pra conferir manualmente, ou tente "Atualizar" de novo — pode ser conexão momentânea.<br><a href="${GSHEET_VIEW_URL}" target="_blank" rel="noopener">Abrir planilha no Google Sheets →</a></div>` : '';

  render(`
    <button class="backlink" onclick="resetAll()">← Início</button>
    <div class="row between" style="margin-bottom:6px;">
      <h2 style="margin-bottom:0;">Painel</h2>
      <div class="row" style="gap:8px;">
        <button class="btn small" onclick="renderRelatorio()">📊 Relatório</button>
        <button class="btn secondary small" onclick="renderConciliacaoDash(true)">↻ Atualizar</button>
      </div>
    </div>
    ${connWarn}
    <label style="margin:10px 0 4px; display:block;"><input type="checkbox" id="autoRefreshChk" style="width:auto;display:inline-block;margin-right:6px;" ${state.autoRefresh?'checked':''}> Atualizar sozinho a cada 30s</label>
    <div class="summary-grid" style="margin-top:10px;">
      <div class="stat"><div class="num">${ok}</div><div class="lbl">OK</div></div>
      <div class="stat"><div class="num" style="color:var(--bad)">${div}</div><div class="lbl">Divergente</div></div>
      <div class="stat"><div class="num" style="color:var(--muted)">${nao}</div><div class="lbl">Não contado</div></div>
      <div class="stat"><div class="num" style="color:var(--warn)">${conf}</div><div class="lbl">Conflito</div></div>
    </div>
    ${renderAccuracyCard(window.concAccuracy)}
    ${concExtras.length ? `<div class="warn-box">⚠ ${concExtras.length} item(ns) contados fora do previsto — veja o filtro "Extras".</div>` : ''}
    <input type="text" id="concSearchLive" placeholder="Filtrar por endereço, produto ou lote..." value="${escapeAttr(state.concSearchLive||'')}" oninput="onConcSearchInput(this)" style="margin-bottom:8px;">
    <div class="filterbar">
      <button class="${filter==='ALL'?'active':''}" onclick="setConcFilter('ALL')">Todos (${total + concExtras.length})</button>
      <button class="${filter==='DIVERGENTE'?'active':''}" onclick="setConcFilter('DIVERGENTE')">Material a mais/menos (${div})</button>
      <button class="${filter==='NAO_CONTADO'?'active':''}" onclick="setConcFilter('NAO_CONTADO')">Não contados (${nao})</button>
      <button class="${filter==='CONFLITO'?'active':''}" onclick="setConcFilter('CONFLITO')">Conflitos (${conf})</button>
      <button class="${filter==='EXTRAS'?'active':''}" onclick="setConcFilter('EXTRAS')">Extras (${concExtras.length})</button>
      <button class="${filter==='PRODUTO'?'active':''}" onclick="setConcFilter('PRODUTO')">Por produto (${produtoRollup.length})</button>
      <button class="${filter==='ACOES'?'active':''}" onclick="setConcFilter('ACOES')">📌 Movimentações a fazer</button>
    </div>
    <div class="table-wrap" style="${filter==='EXTRAS'||filter==='PRODUTO'||filter==='ACOES' ? 'display:none;' : ''}">
      <table>
        <thead><tr>
          <th class="col-endereco" onclick="setConcSort('endereco')">Endereço${sortArrow('endereco')}</th>
          <th class="col-produto" onclick="setConcSort('produto')">Produto${sortArrow('produto')}</th>
          <th class="col-num" onclick="setConcSort('saldo')">Saldo sistema${sortArrow('saldo')}</th>
          <th class="col-num" onclick="setConcSort('qtdContada')">Contado${sortArrow('qtdContada')}</th>
          <th class="col-num" onclick="setConcSort('diff')">Dif.${sortArrow('diff')}</th>
          <th class="col-status" onclick="setConcSort('status')">Status${sortArrow('status')}</th>
          <th class="col-obs">Obs.</th>
        </tr></thead>
        <tbody>${tableRows || '<tr><td colspan="7" class="empty">Nenhum item nesse filtro</td></tr>'}</tbody>
      </table>
    </div>
    ${filter==='EXTRAS' ? `
      ${concExtras.length ? `<div class="muted" style="margin-bottom:10px;">${doneCount}/${concExtras.length} já resolvidos no sistema</div>` : ''}
      ${extrasActionList || '<div class="empty">Nenhum item extra</div>'}
      ${concExtras.length ? `
        <div class="row" style="gap:8px; margin-top:10px;">
          <button class="btn ghost small" onclick="saveExtrasProgress()">⬇ Salvar progresso</button>
          <label class="btn ghost small" style="cursor:pointer;">
            ⬆ Carregar progresso
            <input type="file" id="progressFile" accept=".json" style="display:none;" onchange="loadExtrasProgress()">
          </label>
        </div>` : ''}
    ` : ''}
    ${filter==='PRODUTO' ? `
      <p class="muted" style="margin-bottom:10px;">Soma o produto em todos os endereços do sistema (incluindo os itens extras) — mostra se a diferença é falta de verdade ou só está em outro endereço.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Produto</th><th>Total esperado</th><th>Total contado</th><th>Dif. total</th><th>Status</th></tr></thead>
          <tbody>${produtoRows || '<tr><td colspan="5" class="empty">Nenhum produto com divergência ou extra</td></tr>'}</tbody>
        </table>
      </div>
    ` : ''}
    ${filter==='ACOES' ? renderMovimentacoesBlock() : ''}
    <div style="height:14px;"></div>
    <details class="card">
      <summary style="cursor:pointer; font-weight:700;">+ Juntar backup manual (opcional)</summary>
      <div style="height:8px;"></div>
      <p class="muted">Só necessário se algum aparelho ficou sem internet e baixou um backup CSV localmente.</p>
      <input type="file" id="concCounts" accept=".csv" multiple>
      <div style="height:8px;"></div>
      <button class="btn ghost block" onclick="mergeExtraCsvs()">Juntar ao painel</button>
    </details>
    <div style="height:14px;"></div>
    <button class="btn block" onclick="exportConciliacaoXlsx()">⬇ Baixar relatório completo (.xlsx)</button>
  `);
  document.getElementById('autoRefreshChk').addEventListener('change', (e) => {
    if(e.target.checked){ state.autoRefresh = setInterval(() => renderConciliacaoDash(false), 30000); }
    else { clearInterval(state.autoRefresh); state.autoRefresh = null; }
  });
  if(filter === 'BUSCA'){
    const bb = document.getElementById('buscaBox');
    bb.addEventListener('input', (e) => { state.concSearchTerm = e.target.value; renderConciliacaoResult(); });
    bb.focus();
    bb.setSelectionRange(bb.value.length, bb.value.length);
  }
}

function mergeExtraCsvs(){
  const files = Array.from(document.getElementById('concCounts').files);
  if(!files.length) return;
  let pending = files.length;
  files.forEach(f => {
    const r = new FileReader();
    r.onload = (e) => {
      state.countFiles.push({name:f.name, entries: parseCountCsv(e.target.result, f.name)});
      pending--;
      if(pending===0) computeConciliacao();
    };
    r.readAsText(f, 'UTF-8');
  });
}

function exportConciliacaoXlsx(){
  const concRows = window.concRows || [];
  const concExtras = window.concExtras || [];
  const acc = window.concAccuracy || {};
  const summaryData = [
    {Metrica: 'Cobertura contada (%)', Valor: acc.coverage!==null&&acc.coverage!==undefined ? acc.coverage.toFixed(1) : ''},
    {Metrica: 'Acurácia por item (%)', Valor: acc.skuAccuracy!==null&&acc.skuAccuracy!==undefined ? acc.skuAccuracy.toFixed(1) : ''},
    {Metrica: 'Acurácia por quantidade (%)', Valor: acc.qtyAccuracy!==null&&acc.qtyAccuracy!==undefined ? acc.qtyAccuracy.toFixed(1) : ''},
    {Metrica: 'Itens contados', Valor: acc.countedN||0},
    {Metrica: 'Total de itens no sistema', Valor: acc.totalN||0},
    {Metrica: 'Itens extra (fora do previsto)', Valor: acc.extrasN||0}
  ];
  const mainData = concRows.map(r => {
    const loteKey = (r.lote && r.lote !== '-') ? r.lote : '';
    const bateNoTotal = r.status==='DIVERGENTE' && window.concBateNoTotalKeys && window.concBateNoTotalKeys.has(r.produto + '|||' + loteKey);
    return {
      'Endereco': r.endereco, 'Produto': r.produto, 'Tipo': r.tipo, 'Embalagem': r.embalagem, 'Lote': r.lote,
      'Situacao': r.situacao, 'Saldo Sistema': r.saldo, 'Qtd Contada': r.qtdContada, 'Diferenca': r.diff,
      'Status': bateNoTotal ? 'REALOCADO' : r.status,
      'Observacao': bateNoTotal ? 'bate no total do lote — mal alocado, não é falta real' : r.obs,
      'Contador(es)': r.contadores
    };
  });
  const extrasData = concExtras.map(r => ({
    'Produto': r.produto, 'Tipo': r.tipo, 'Embalagem': r.embalagem, 'Lote': r.lote, 'Qtd Contada': r.qtdContada,
    'Mover De (sistema)': r.hintEndereco || '(não identificado)',
    'Mover Para (achado)': r.endereco,
    'Acao': r.hintEndereco ? 'Transferir endereço no sistema' : 'Investigar - produto novo ou erro de cadastro',
    'Contador(es)': r.contadores
  }));
  const produtoStatusLabelXlsx = {BATE_NO_TOTAL:'Bate no total (troca de endereço)', FALTA_REAL:'Falta real', SOBRA_REAL:'Sobra real', INCOMPLETO:'Incompleto', NAO_CADASTRADO:'Não cadastrado'};
  const produtoData = (window.concProdutoRollup || []).map(r => ({
    'Produto': r.produto, 'Total Esperado': r.totalEsperado, 'Total Contado': r.totalContado,
    'Diferenca Total': r.diffTotal, 'Status': produtoStatusLabelXlsx[r.status]
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), 'Resumo');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(mainData), 'Conciliacao');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(extrasData), 'Itens nao previstos');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(produtoData), 'Por Produto');
  XLSX.writeFile(wb, `conciliacao_${SITE.nome}_${dateStamp()}.xlsx`);
}

renderHome();
</script></body>
</html>
